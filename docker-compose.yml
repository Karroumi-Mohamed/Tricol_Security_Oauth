version: '3.8'

services:
  tricol-db:
    image: postgres:15
    container_name: tricol-db
    environment:
      POSTGRES_DB: tricol_db
      POSTGRES_USER: tricol_user
      POSTGRES_PASSWORD: tricol_password
    ports:
      - "5432:5432"
    volumes:
      - tricol_db_data:/var/lib/postgresql/data
    networks:
      - tricol-network

  tricol-keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: tricol-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://tricol-keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080" 
    depends_on:
      - tricol-keycloak-db
    networks:
      - tricol-network

  tricol-keycloak-db:
    image: postgres:15
    container_name: tricol-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - tricol-network

  tricol-app:
    build: .
    container_name: tricol-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://tricol-db:5432/tricol_db
      SPRING_DATASOURCE_USERNAME: tricol_user
      SPRING_DATASOURCE_PASSWORD: tricol_password
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://tricol-keycloak:8080/realms/tricol-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://tricol-keycloak:8080/realms/tricol-realm/protocol/openid-connect/certs
    depends_on:
      - tricol-db
      - tricol-keycloak
    networks:
      - tricol-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: tricol-jenkins
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
    networks:
      - tricol-network

  sonarqube:
    image: sonarqube:community
    container_name: tricol-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    depends_on:
      - sonarqube-db
    networks:
      - tricol-network

  sonarqube-db:
    image: postgres:15
    container_name: sonarqube-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - tricol-network

volumes:
  tricol_db_data:
  keycloak_db_data:
  jenkins_data:
  sonarqube_db_data:

networks:
  tricol-network:
    driver: bridge
